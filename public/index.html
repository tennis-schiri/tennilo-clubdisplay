<!doctype html>
<!-- TENNILO ClubDisplay | Copyright © 2026 TENNILO | Alle Rechte vorbehalten. -->
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071a2c">
<title>TENNILO ClubDisplay</title>
<link id="favicon" rel="icon" href="assets/favicon.png" type="image/png">
<script>
  // TENNILO ClubDisplay | Copyright © 2026 TENNILO
  if (location.hostname === 'clubdisplay.ntc93.de') {
    document.documentElement.dataset.club = 'ntc';
    document.title = 'NTC 93 · ClubDisplay';
    document.querySelector('meta[name="theme-color"]').content = '#075357';
    document.getElementById('favicon').href = 'assets/ntc93-logo.png';
  }
</script>
<link rel="stylesheet" href="assets/app.css?v=0414">
<script defer src="assets/app.js?v=0414"></script>
</head>
<body class="fixed-screen">
<header>
  <div class="brand"><img id="brand-logo" src="assets/clubdisplay.png" alt="TENNILO ClubDisplay"><span class="ntc-brand-title" id="ntc-brand-title">NTC 93 <small>ClubDisplay</small></span><span id="club">Vereinsdisplay</span></div>
  <div class="clock"><strong id="clock">--:--</strong><span id="date"></span></div>
  <button id="weather-head" data-action="weather" aria-label="Wetterdetails">Wetter …</button>
  <div class="tools"><button id="language" aria-label="Language">EN</button><button id="fullscreen" aria-label="Vollbild">⛶</button></div>
</header>
<main id="main" tabindex="-1">
  <div class="eyebrow"><span class="status-dot"></span><span id="mode"></span><span class="tag" id="demo"></span></div>
  <section id="screen" aria-live="off"></section>
  <div class="info-progress-row">
    <div id="progress" aria-hidden="true"></div>
    <div id="info-controls" role="group" aria-label="Informationsmodus" hidden>
      <span id="info-position" aria-live="off"></span>
      <button type="button" id="info-prev" data-action="info-prev" aria-label="Vorherige Infoseite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <button type="button" id="info-toggle" data-action="info-toggle" aria-label="Automatik anhalten" aria-pressed="false"><svg id="info-pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg><svg id="info-play-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m9 5 11 7-11 7z" fill="currentColor" stroke="none"/></svg></button>
      <button type="button" id="info-next" data-action="info-next" aria-label="Nächste Infoseite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>
</main>
<nav id="nav" aria-label="Menü"></nav>
<footer><span id="notice"></span><span class="version">v0.4.14</span></footer>
<dialog id="admin-dialog" aria-labelledby="admin-title">
  <form id="admin-form">
    <h2 id="admin-title">Admin-Freigabe</h2>
    <label for="admin-pin" id="admin-label">Admin-PIN</label>
    <input id="admin-pin" type="password" inputmode="numeric" pattern="[0-9]{6,20}" minlength="6" maxlength="20" autocomplete="off" required>
    <p id="admin-status" role="status"></p>
    <div class="actions"><button type="button" id="admin-cancel">Abbrechen</button><button type="submit" id="admin-submit" class="primary">Vollbild verlassen</button></div>
  </form>
</dialog>
<noscript>Bitte JavaScript aktivieren.</noscript>
</body></html>
