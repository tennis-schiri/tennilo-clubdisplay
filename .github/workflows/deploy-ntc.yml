name: ClubDisplay – NTC Live-Upload
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/deploy.sh'
      - '.github/workflows/deploy-ntc.yml'
permissions:
  contents: read
concurrency:
  group: clubdisplay-ntc
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Upload mit Ziel- und HTTPS-Prüfung
        env:
          FTP_HOST: ${{ secrets.NTC_FTP_HOST }}
          FTP_USER: ${{ secrets.NTC_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NTC_FTP_PASSWORD }}
          ADMIN_PIN: ${{ secrets.NTC_ADMIN_PIN }}
          DOMAIN: clubdisplay.ntc93.de
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/deploy.sh
