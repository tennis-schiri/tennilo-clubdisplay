name: ClubDisplay – TENNILO Live-Upload
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-tennilo.yml'
permissions:
  contents: read
concurrency:
  group: clubdisplay-tennilo
  cancel-in-progress: false
jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Workflow eingerichtet. Kein automatischer Upload.'
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Upload mit Ziel- und HTTPS-Prüfung
        env:
          FTP_HOST: ${{ secrets.TENNILO_FTP_HOST }}
          FTP_USER: ${{ secrets.TENNILO_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.TENNILO_FTP_PASSWORD }}
          DOMAIN: clubdisplay.tennilo.de
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/deploy.sh
