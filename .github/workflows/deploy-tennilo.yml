name: ClubDisplay – TENNILO Live-Upload
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/assets/**'
      - 'public/*.php'
      - 'scripts/deploy.sh'
permissions:
  contents: read
concurrency:
  group: clubdisplay-tennilo
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Upload mit Ziel- und HTTPS-Prüfung
        env:
          FTP_HOST: ${{ secrets.TENNILO_FTP_HOST }}
          FTP_USER: ${{ secrets.TENNILO_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.TENNILO_FTP_PASSWORD }}
          ADMIN_PIN: ${{ secrets.TENNILO_ADMIN_PIN }}
          DOMAIN: clubdisplay.tennilo.de
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/deploy.sh
