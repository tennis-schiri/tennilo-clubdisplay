name: ClubDisplay – Admin-Backend manuell veröffentlichen
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clubdisplay-admin
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Admin-Backend prüfen
        run: |
          php -l public/admin/index.php
          php -l public/admin/lib.php
          php -l public/admin/managed.php
          php -l public/admin/providers.php
          php -l deploy/backup-admin.php
          php -l public/admin/player.php
          node --check public/admin/player.js
          php -r 'if(!extension_loaded("gd")){fwrite(STDERR,"GD required for media tests\n");exit(1);}'
          php tests/admin-test.php
          bash tests/admin-http-test.sh
      - name: Browserprüfung vor Live-Upload
        run: |
          npm install --no-save --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium
          CD_BROWSER_TEST=1 bash tests/admin-http-test.sh
      - name: Nur Admin-Dateien per FTPS übertragen
        env:
          FTP_HOST: ${{ secrets.TENNILO_FTP_HOST }}
          FTP_USER: ${{ secrets.TENNILO_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.TENNILO_FTP_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.TENNILO_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?}" "${FTP_USER:?}" "${FTP_PASSWORD:?}" "${ADMIN_PASSWORD:?Admin password missing}"
          [[ "$FTP_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          php -r '$p=getenv("ADMIN_PASSWORD"); $g=bin2hex(random_bytes(32)); if(strlen($p)<16||strlen($p)>72)exit(1); file_put_contents($argv[2],$g); $hash=password_hash($p,PASSWORD_BCRYPT); if(!$hash)exit(1); file_put_contents($argv[1],str_replace(["__CD_ADMIN_PASSWORD_HASH__","__CD_ADMIN_GUARD_TOKEN__"],[$hash,$g],file_get_contents("public/admin/index.php")));' "$tmp/index.php" "$tmp/guard"
          php -l "$tmp/index.php"
          upload() { curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs --connect-timeout 15 --max-time 90 --user "$FTP_USER:$FTP_PASSWORD" --upload-file "$1" "ftp://$FTP_HOST:21/$2"; }
          printf '%s\n' "clubdisplay.tennilo.de:admin:${GITHUB_RUN_ID}" > "$tmp/check"
          upload "$tmp/check" clubdisplay-admin-deploy-check.txt
          curl --fail --silent --show-error --max-time 30 "https://clubdisplay.tennilo.de/clubdisplay-admin-deploy-check.txt?run=${GITHUB_RUN_ID}" -o "$tmp/remote"
          cmp "$tmp/check" "$tmp/remote"
          # No real database or credentials are sent to the storage directory during the probe.
          upload deploy/admin-storage.htaccess clubdisplay-admin/.htaccess
          printf 'Non-sensitive storage protection probe\n' > "$tmp/probe"
          probe="probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          upload "$tmp/probe" "clubdisplay-admin/$probe"
          deny() {
            local code
            code="$(curl --silent --show-error --max-time 30 --write-out '%{http_code}' --output /dev/null --header 'Cache-Control: no-cache' "https://clubdisplay.tennilo.de/$1?run=${GITHUB_RUN_ID}")"
            [[ "$code" == 403 ]] || { echo "::error::Storage protection check failed (HTTP $code); refusing backend deployment."; exit 1; }
          }
          deny "clubdisplay-admin/$probe"
          deny "clubdisplay-admin/"
          deny "clubdisplay-admin/clubdisplay-admin.sqlite"
          deny "clubdisplay-admin/clubdisplay-admin.sqlite-wal"
          deny "clubdisplay-admin/clubdisplay-admin.sqlite-shm"
          deny "clubdisplay-admin/clubdisplay-admin.sqlite-journal"
          upload "$tmp/guard" clubdisplay-admin/.deployment-verified
          deny "clubdisplay-admin/.deployment-verified"
          upload deploy/backup-admin.php clubdisplay-admin/backup-admin.php
          deny "clubdisplay-admin/backup-admin.php"
          echo 'Storage HTTP access denied; deploying backend.'
          upload public/admin/providers.php admin/providers.php
          upload public/admin/managed.php admin/managed.php
          upload public/admin/player.php admin/player.php
          upload public/admin/player.css admin/player.css
          upload public/admin/player.js admin/player.js
          upload public/admin/lib.php admin/lib.php
          upload public/admin/admin.css admin/admin.css
          upload "$tmp/index.php" admin/index.php
          status="$(curl --silent --show-error --max-time 30 --write-out '%{http_code}' "https://clubdisplay.tennilo.de/admin/?run=${GITHUB_RUN_ID}" -o "$tmp/login")"
          if [[ "$status" != 200 ]]; then
            diagnostic="$(grep -Ex 'CD_ADMIN_(HASH|STORAGE_CONFIG|STORAGE_DIRECTORY|STORAGE_PERMISSIONS|STORAGE_NOT_PRIVATE|STORAGE_GUARD|SQLITE_DRIVER|DATABASE_INIT)' "$tmp/login" || true)"
            echo "::error::Admin HTTPS status $status; diagnostic: ${diagnostic:-UNKNOWN}"
            exit 1
          fi
          grep -Fq 'Administrator-Anmeldung' "$tmp/login"
          ! grep -Fq 'TENNILO · Kundenverwaltung' "$tmp/login"
          ! grep -Fq 'Bildschirm anlegen' "$tmp/login"
          for query in 'portal=club' 'portal=club&verein=ntc93'; do
            curl --fail --silent --show-error --max-time 30 "https://clubdisplay.tennilo.de/admin/?$query" -o "$tmp/club-login"
            grep -Fq 'Vereinsadmin-Anmeldung' "$tmp/club-login"
            ! grep -Fq 'TENNILO · Kundenverwaltung' "$tmp/club-login"
            ! grep -Fq 'Administrator-Anmeldung' "$tmp/club-login"
          done
          grep -Fq '<p>NTC 93</p>' "$tmp/club-login"
          curl --fail --silent --show-error --max-time 30 "https://clubdisplay.tennilo.de/admin/?player=1" -o "$tmp/player"
          grep -Fq 'player.js' "$tmp/player"
          for asset in player.js player.css admin.css; do
            curl --fail --silent --show-error --max-time 30 "https://clubdisplay.tennilo.de/admin/$asset?run=${GITHUB_RUN_ID}" -o "$tmp/asset"
            cmp "public/admin/$asset" "$tmp/asset"
          done
          status="$(curl --silent --show-error --max-time 30 -H 'Content-Type: application/json' --data '{"action":"snapshot","token":"invalid"}' --write-out '%{http_code}' -o "$tmp/device" "https://clubdisplay.tennilo.de/admin/?device=1")"
          [[ "$status" == 403 ]]
          status="$(curl --silent --show-error --max-time 30 --write-out '%{http_code}' -o "$tmp/preview" "https://clubdisplay.tennilo.de/admin/?preview-data=1&club=ntc93&screen=hall")"
          [[ "$status" == 403 ]]
          deny "clubdisplay-admin/clubdisplay-admin.sqlite"
          echo 'Separate login pages and managed player reachable; unauthenticated device and preview denied.'
